name: Fetch URL via Email

on:
  issues:
    types: [opened]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Get URL from Issue Title
        id: get-url
        env:
          ISSUE_TITLE_IN: ${{ github.event.issue.title }}
        run: |
          delim="URL_EOF_${RANDOM}${RANDOM}"
          echo "url<<$delim" >> "$GITHUB_OUTPUT"
          echo "$ISSUE_TITLE_IN" >> "$GITHUB_OUTPUT"
          echo "$delim" >> "$GITHUB_OUTPUT"

      - name: Fetch Content
        env:
          URL_IN: ${{ steps.get-url.outputs.url }}
        run: |
          URL="$URL_IN"
          echo "Fetching: $URL"
          # Use allorigins.win to bypass CORS and fetch the site
          CONTENT=$(curl -s "https://api.allorigins.win/raw?url=${URL}")
          echo "$CONTENT" > result.txt

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          connection_url: ${{ secrets.MAIL_URL }}
          from: ${{ secrets.EMAIL_FROM }}
          to: ${{ secrets.EMAIL_TO }}
          subject: "Proxy Result: ${{ github.event.issue.title }}"
          body: |
            Here is the content from:
            ${{ github.event.issue.title }}
            
            ---
            $(cat result.txt)
